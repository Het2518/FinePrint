services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fineprint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fineprint
      POSTGRES_PASSWORD: fineprint_secret
      POSTGRES_DB: fineprint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db_init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineprint -d fineprint_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fineprint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservice: API Gateway (frontend-facing) ────────────────────────────
  api_gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fineprint_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://fineprint:fineprint_secret@db:5432/fineprint_db
      - REDIS_URL=redis://redis:6379/0
      - AGENT_SERVICE_URL=http://agent_service:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Microservice: Agent Orchestration (LangGraph + MCP) ───────────────────
  agent_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fineprint_agent
    command: uvicorn services.agent_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - chromadb_store:/app/.chromadb_store
    environment:
      - DATABASE_URL=postgresql://fineprint:fineprint_secret@db:5432/fineprint_db
    depends_on:
      db:
        condition: service_healthy

  # ── Microservice: Ingestion (document parsing + scheduled scans) ──────────
  ingestion_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fineprint_ingestion
    command: uvicorn services.ingestion_service.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://fineprint:fineprint_secret@db:5432/fineprint_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  chromadb_store:
